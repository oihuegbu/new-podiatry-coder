services:

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    depends_on:
      - qdrant
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - NOTES_DIR=/app/attachments
    volumes:
      - ./doctors_notes:/app/attachments:ro
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data/result_cache:/app/data/result_cache
      - ./data/qdrant_store:/app/data/qdrant_store
      - ./app:/app/app
      - ./run.py:/app/run.py
      - hf_cache:/root/.cache/huggingface
    command: >
      sh -c "
        echo 'Waiting for Qdrant to be ready...';
        until curl -sf http://qdrant:6333/readyz > /dev/null 2>&1; do
          echo '  Qdrant not ready yet, retrying in 10s...'; sleep 10;
        done;
        echo 'Qdrant is ready.';
        python run.py
      "

volumes:
  qdrant_data:
  hf_cache:
