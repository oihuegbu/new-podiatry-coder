services:

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - NOTES_DIR=/app/attachments
    volumes:
      - ../kachi203-attachments:/app/attachments:ro
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data/result_cache:/app/data/result_cache
    command: python run.py --rebuild-index

volumes:
  qdrant_data:
