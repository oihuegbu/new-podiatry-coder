name: Medical coding safety

on:
  pull_request:
  push:
    branches: [main, claude-medical-coder]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app claude_coder tests tools
      - run: python tests/check_no_hardcoding.py
      - run: python tests/check_rule_coverage.py
      - run: python tests/check_clause_coverage.py
      - run: python -m pytest -q
      - run: PYTHONPATH=. python tests/test_agents.py
      - run: PYTHONPATH=. python tests/test_feedback_consistency.py
      - run: PYTHONPATH=. python tests/test_validator_checks.py
