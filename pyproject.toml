[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-medical-coder"
version = "0.1.0"
description = "Source-compiled evidence-to-claim autonomous medical coding kernel"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
medical-coder = "medical_coder.cli:main"

[tool.setuptools.packages.find]
include = ["medical_coder*"]

